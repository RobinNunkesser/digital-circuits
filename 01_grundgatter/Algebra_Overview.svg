<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Created for Digital Monorepo Work (clean layout, modern theme) -->
<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   width="220.0mm"
   height="22.0mm"
   viewBox="40 160 1230 120">
  <defs>
    <style>
      .wire { stroke: #0284c7; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gate { stroke: #334155; stroke-width: 3.5; fill: #ffffff; }
      .gate-sym { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: bold; fill: #1e293b; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #0284c7; }
      .dot { fill: #0284c7; stroke: none; }
      .pin-box { stroke: #64748b; stroke-width: 2.5; fill: #ffffff; }
      .pin-dot { stroke: #0284c7; stroke-width: 3.0; fill: #ffffff; }
      .out-lamp { stroke: #dc2626; stroke-width: 3.5; fill: #ffffff; }
      .out-lamp-outer { stroke: #ef4444; stroke-width: 2.5; fill: none; }
      .neg-bubble { stroke: #334155; stroke-width: 3.0; fill: #ffffff; }
    </style>
  </defs>

<g stroke-linecap="square">

  <!-- ================= Circuit 1: AND ================= -->
  <!-- Inputs e1, e2 -->
  <path d="M 105,185 L 135,185 L 135,215 L 105,215 Z" class="pin-box"/>
  <circle cx="120.0" cy="200.0" r="9.0" class="pin-dot"/>
  <text text-anchor="end" x="90.0" y="208.0" class="label">e1</text>

  <path d="M 105,225 L 135,225 L 135,255 L 105,255 Z" class="pin-box"/>
  <circle cx="120.0" cy="240.0" r="9.0" class="pin-dot"/>
  <text text-anchor="end" x="90.0" y="248.0" class="label">e2</text>

  <!-- Straight wires into AND -->
  <path d="M 135,200 L 220,200" class="wire"/>
  <path d="M 135,240 L 220,240" class="wire"/>

  <!-- AND gate -->
  <path d="M 221,190 L 279,190 L 279,250 L 221,250 Z" class="gate"/>
  <text text-anchor="middle" x="250.0" y="228.0" class="gate-sym">&amp;</text>

  <!-- Output wire -->
  <path d="M 280,220 L 350,220" class="wire"/>

  <!-- Lamp a1 -->
  <circle cx="366.0" cy="220.0" r="9.0" class="out-lamp"/>
  <circle cx="366.0" cy="220.0" r="15.0" class="out-lamp-outer"/>
  <text text-anchor="start" x="395.0" y="228.0" class="label">a1</text>


  <!-- ================= Circuit 2: OR ================= -->
  <!-- Inputs e3, e4 -->
  <path d="M 505,185 L 535,185 L 535,215 L 505,215 Z" class="pin-box"/>
  <circle cx="520.0" cy="200.0" r="9.0" class="pin-dot"/>
  <text text-anchor="end" x="490.0" y="208.0" class="label">e3</text>

  <path d="M 505,225 L 535,225 L 535,255 L 505,255 Z" class="pin-box"/>
  <circle cx="520.0" cy="240.0" r="9.0" class="pin-dot"/>
  <text text-anchor="end" x="490.0" y="248.0" class="label">e4</text>

  <!-- Straight wires into OR -->
  <path d="M 535,200 L 620,200" class="wire"/>
  <path d="M 535,240 L 620,240" class="wire"/>

  <!-- OR gate -->
  <path d="M 621,190 L 679,190 L 679,250 L 621,250 Z" class="gate"/>
  <text text-anchor="middle" x="650.0" y="228.0" class="gate-sym">≥1</text>

  <!-- Output wire -->
  <path d="M 680,220 L 750,220" class="wire"/>

  <!-- Lamp a2 -->
  <circle cx="766.0" cy="220.0" r="9.0" class="out-lamp"/>
  <circle cx="766.0" cy="220.0" r="15.0" class="out-lamp-outer"/>
  <text text-anchor="start" x="795.0" y="228.0" class="label">a2</text>


  <!-- ================= Circuit 3: NOT ================= -->
  <!-- Input e5 -->
  <path d="M 905,205 L 935,205 L 935,235 L 905,235 Z" class="pin-box"/>
  <circle cx="920.0" cy="220.0" r="9.0" class="pin-dot"/>
  <text text-anchor="end" x="890.0" y="228.0" class="label">e5</text>

  <!-- Straight wire into NOT -->
  <path d="M 935,220 L 1020,220" class="wire"/>

  <!-- NOT gate: Box (58x60) + Negation Bubble (radius 6) -->
  <path d="M 1021,190 L 1079,190 L 1079,250 L 1021,250 Z" class="gate"/>
  <text text-anchor="middle" x="1050.0" y="228.0" class="gate-sym">1</text>
  <circle cx="1088.0" cy="220.0" r="6.0" class="neg-bubble"/>

  <!-- Output wire -->
  <path d="M 1094,220 L 1170,220" class="wire"/>

  <!-- Lamp a3 -->
  <circle cx="1186.0" cy="220.0" r="9.0" class="out-lamp"/>
  <circle cx="1186.0" cy="220.0" r="15.0" class="out-lamp-outer"/>
  <text text-anchor="start" x="1215.0" y="228.0" class="label">a3</text>

</g>
</svg>
