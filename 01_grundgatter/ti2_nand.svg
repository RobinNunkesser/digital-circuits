<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Created for Digital Monorepo Work (clean layout, modern theme) -->
<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   width="75.0mm"
   height="24.0mm"
   viewBox="100 165 390 110">
  <defs>
    <style>
      .wire { stroke: #0284c7; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gate { stroke: #334155; stroke-width: 3.5; fill: #ffffff; }
      .gate-sym { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: bold; fill: #1e293b; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #0284c7; }
      .dot { fill: #0284c7; stroke: none; }
      .pin-box { stroke: #64748b; stroke-width: 2.5; fill: #ffffff; }
      .pin-dot { stroke: #0284c7; stroke-width: 3.0; fill: #ffffff; }
      .out-lamp { stroke: #dc2626; stroke-width: 3.5; fill: #ffffff; }
      .out-lamp-outer { stroke: #ef4444; stroke-width: 2.5; fill: none; }
      .neg-bubble { stroke: #334155; stroke-width: 3.0; fill: #ffffff; }
    </style>
  </defs>

<g stroke-linecap="square">
  <!-- Inputs e1, e2 -->
  <path d="M 149,185 L 179,185 L 179,215 L 149,215 Z" class="pin-box"/>
  <circle cx="164.0" cy="200.0" r="9.0" class="pin-dot"/>
  <text text-anchor="end" x="135.0" y="208.0" class="label">e1</text>

  <path d="M 149,225 L 179,225 L 179,255 L 149,255 Z" class="pin-box"/>
  <circle cx="164.0" cy="240.0" r="9.0" class="pin-dot"/>
  <text text-anchor="end" x="135.0" y="248.0" class="label">e2</text>

  <!-- Straight horizontal wires -->
  <path d="M 179,200 L 260,200" class="wire"/>
  <path d="M 179,240 L 260,240" class="wire"/>

  <!-- NAND gate: box (width 58, height 60) + negation bubble (radius 6) -->
  <path d="M 261,190 L 319,190 L 319,250 L 261,250 Z" class="gate"/>
  <text text-anchor="middle" x="290.0" y="228.0" class="gate-sym">&amp;</text>
  <circle cx="328.0" cy="220.0" r="6.0" class="neg-bubble"/>

  <!-- Straight horizontal output wire -->
  <path d="M 334,220 L 400,220" class="wire"/>

  <!-- Lamp a -->
  <circle cx="416.0" cy="220.0" r="9.0" class="out-lamp"/>
  <circle cx="416.0" cy="220.0" r="15.0" class="out-lamp-outer"/>
  <text text-anchor="start" x="445.0" y="228.0" class="label">a</text>
</g>
</svg>
