<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Created with Digital by H.Neemann (clean layout) -->
<svg
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns="http://www.w3.org/2000/svg"
   width="95.0mm"
   height="45.0mm"
   viewBox="120 110 590 280">
    <defs>
    <style>
      .wire { stroke: #0284c7; stroke-width: 3.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .gate { stroke: #334155; stroke-width: 3.5; fill: #ffffff; }
      .gate-sym { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: bold; fill: #1e293b; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 20px; font-weight: bold; fill: #1e293b; }
      .sublabel { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #0284c7; }
      .dot { fill: #0284c7; stroke: none; }
      .pin-box { stroke: #64748b; stroke-width: 2.5; fill: #ffffff; }
      .pin-dot { stroke: #0284c7; stroke-width: 3.0; fill: #ffffff; }
      .out-lamp { stroke: #dc2626; stroke-width: 3.5; fill: #ffffff; }
      .out-lamp-outer { stroke: #ef4444; stroke-width: 2.5; fill: none; }
      .neg-bubble { stroke: #334155; stroke-width: 3.0; fill: #ffffff; }
      .delay-box { stroke: #334155; stroke-width: 3.0; fill: #f8fafc; }
      .delay-text { font-family: system-ui, -apple-system, sans-serif; font-size: 18px; font-weight: bold; fill: #334155; }
    </style>
  </defs>


<g stroke-linecap="square">
<!-- Delay Elements -->
<rect x="160" y="170" width="40" height="40" class="delay-box"/>
<text text-anchor="middle" x="180.0" y="196.0"  class="delay-text"class="delay-text">z⁻¹</text>

<rect x="340" y="170" width="40" height="40" class="delay-box"/>
<text text-anchor="middle" x="360.0" y="196.0"  class="delay-text"class="delay-text">z⁻¹</text>

<!-- Vertical bus lines -->
<path d="M 180,140 L 180,170" class="wire"/>
<path d="M 180,210 L 180,320 L 440,320" class="wire"/>
<path d="M 240,140 L 240,340 L 440,340" class="wire"/>
<path d="M 300,140 L 300,240 L 440,240" class="wire"/>
<path d="M 300,240 L 300,360 L 440,360" class="wire"/>
<path d="M 360,140 L 360,170" class="wire"/>
<path d="M 360,210 L 360,260 L 440,260" class="wire"/>

<!-- Intentional branch dot at x3 -->
<circle cx="300.0" cy="240.0" r="4.5" class="dot"/>

<!-- AND Gate 1 (Top) -->
<path d="M 441,230 L 499,230 L 499,290 L 441,290 Z" class="gate"/>
<text text-anchor="middle" x="470.0" y="252.0"  class="gate-sym">&amp;</text>

<!-- AND Gate 2 (Bottom) -->
<path d="M 441,310 L 499,310 L 499,370 L 441,370 Z" class="gate"/>
<text text-anchor="middle" x="470.0" y="332.0"  class="gate-sym">&amp;</text>

<!-- Gate to OR wires -->
<path d="M 500,260 L 530,260 L 530,280 L 560,280" class="wire"/>
<path d="M 500,340 L 530,340 L 530,320 L 560,320" class="wire"/>
<path d="M 620,300 L 660,300" class="wire"/>

<!-- OR Gate -->
<path d="M 561,270 L 619,270 L 619,330 L 561,330 Z" class="gate"/>
<text text-anchor="middle" x="590.0" y="292.0"  class="gate-sym">≥1</text>

<!-- Output y -->
<circle cx="676.0" cy="300.0" r="9.0" class="out-lamp"/>
<circle cx="676.0" cy="300.0" r="15.0" class="out-lamp-outer"/>
<text text-anchor="start" x="705.0" y="309.0" class="label">y</text>

<!-- Inputs Top -->
<path d="M 165,110 L 195,110 L 195,140 L 165,140 Z" class="pin-box"/>
<circle cx="180.0" cy="125.0" r="9.0" class="pin-dot"/>
<text text-anchor="middle" x="180.0" y="102.0" class="label">x1</text>

<path d="M 225,110 L 255,110 L 255,140 L 225,140 Z" class="pin-box"/>
<circle cx="240.0" cy="125.0" r="9.0" class="pin-dot"/>
<text text-anchor="middle" x="240.0" y="102.0" class="label">x2</text>

<path d="M 285,110 L 315,110 L 315,140 L 285,140 Z" class="pin-box"/>
<circle cx="300.0" cy="125.0" r="9.0" class="pin-dot"/>
<text text-anchor="middle" x="300.0" y="102.0" class="label">x3</text>

<path d="M 345,110 L 375,110 L 375,140 L 345,140 Z" class="pin-box"/>
<circle cx="360.0" cy="125.0" r="9.0" class="pin-dot"/>
<text text-anchor="middle" x="360.0" y="102.0" class="label">x4</text>
</g>
</svg>
