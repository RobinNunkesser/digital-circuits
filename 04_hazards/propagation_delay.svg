<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 380" width="100%" height="100%" style="background:#ffffff; font-family:system-ui, -apple-system, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1e293b"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#0f172a">Gatterlaufzeit (Propagation Delay)</text>

  <!-- Input Signal Section (y: 60 - 170) -->
  <text x="80" y="115" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="end">Eingang x</text>
  <line x1="90" y1="160" x2="800" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="70" x2="800" y2="70" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <line x1="90" y1="115" x2="800" y2="115" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="75" y="75" font-size="11" fill="#64748b" text-anchor="end">100%</text>
  <text x="75" y="120" font-size="11" fill="#64748b" text-anchor="end">50%</text>
  <text x="75" y="165" font-size="11" fill="#64748b" text-anchor="end">0%</text>

  <!-- Input Waveform (Blue) -->
  <path d="M 90 160 L 200 160 C 215 160 220 135 225 115 C 230 95 235 70 250 70 L 520 70 C 535 70 540 95 545 115 C 550 135 555 160 570 160 L 780 160" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>

  <!-- Output Signal Section (y: 190 - 300) -->
  <text x="80" y="245" font-size="14" font-weight="bold" fill="#16a34a" text-anchor="end">Ausgang y</text>
  <line x1="90" y1="290" x2="800" y2="290" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="90" y1="200" x2="800" y2="200" stroke="#e2e8f0" stroke-dasharray="4 4"/>
  <line x1="90" y1="245" x2="800" y2="245" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="75" y="205" font-size="11" fill="#64748b" text-anchor="end">100%</text>
  <text x="75" y="250" font-size="11" fill="#64748b" text-anchor="end">50%</text>
  <text x="75" y="295" font-size="11" fill="#64748b" text-anchor="end">0%</text>

  <!-- Output Waveform (Inverted, Green) with propagation delay -->
  <!-- Falling 50% occurs at x=315 (delay = 90px), Rising 50% occurs at x=635 (delay = 90px) -->
  <path d="M 90 200 L 290 200 C 305 200 310 225 315 245 C 320 265 325 290 340 290 L 610 290 C 625 290 630 265 635 245 C 640 225 645 200 660 200 L 780 200" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

  <!-- Vertical dashed guide lines at 50% crossing points -->
  <!-- Input rise 50%: x = 225 -->
  <line x1="225" y1="115" x2="225" y2="345" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- Output fall 50%: x = 315 -->
  <line x1="315" y1="245" x2="315" y2="345" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Input fall 50%: x = 545 -->
  <line x1="545" y1="115" x2="545" y2="345" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>
  <!-- Output rise 50%: x = 635 -->
  <line x1="635" y1="245" x2="635" y2="345" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Delay measurement t_pHL -->
  <line x1="228" y1="330" x2="312" y2="330" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="270" y="352" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">t<tspan baseline-shift="sub" font-size="10">pHL</tspan></text>
  <text x="270" y="368" font-size="10.5" fill="#64748b" text-anchor="middle">(High → Low)</text>

  <!-- Delay measurement t_pLH -->
  <line x1="548" y1="330" x2="632" y2="330" stroke="#dc2626" stroke-width="2" marker-start="url(#arrow-red)" marker-end="url(#arrow-red)"/>
  <text x="590" y="352" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">t<tspan baseline-shift="sub" font-size="10">pLH</tspan></text>
  <text x="590" y="368" font-size="10.5" fill="#64748b" text-anchor="middle">(Low → High)</text>

  <!-- Summary formula box -->
  <rect x="360" y="318" width="150" height="42" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="435" y="343" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">t<tspan baseline-shift="sub" font-size="9">pd</tspan> = ½ (t<tspan baseline-shift="sub" font-size="9">pHL</tspan> + t<tspan baseline-shift="sub" font-size="9">pLH</tspan>)</text>

  <!-- Time Axis arrow -->
  <line x1="90" y1="330" x2="800" y2="330" stroke="#1e293b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="815" y="335" font-size="14" font-weight="bold" fill="#1e293b">t</text>
</svg>
